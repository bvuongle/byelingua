test:
  stage: test
  script:
    - sh ./scripts/test-gitlab-ci.sh
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage-reports/coverage.xml
  tags:
    - test

build-production-env:
  stage: build
  script:
    - TAG=prod FRONTEND_ENV=production sh ./scripts/build.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"
    - if: $CI_COMMIT_REF_NAME == "master" && $CI_PIPELINE_SOURCE != "merge_request_event"
  tags:
    - build
